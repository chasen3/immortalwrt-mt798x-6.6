name: Build RAX3000M‑NAND‑MTK mtd‑rw 6.6
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache ecj fastjar file g++ gawk gettext git unzip libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-setuptools python3-yaml unzip wget zlib1g-dev flex bison libtool rsync

      - name: Download kmod-mtd-rw source (curl zip, avoid git clone auth error)
        run: |
          mkdir -p package/kmod-mtd-rw
          curl -L https://github.com/robimarko/openwrt-mtd-rw/archive/refs/heads/master.zip -o mtdrw.zip
          unzip -q mtdrw.zip
          cp -r openwrt-mtd-rw-master/* package/kmod-mtd-rw/
          rm -rf openwrt-mtd-rw-master mtdrw.zip

      - name: Feeds update install
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate config NAND‑MTK
        run: |
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_rax3000m_nand_mtk=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mtd-rw=y" >> .config
          make defconfig

      - name: Download dl sources
        run: make download -j$(nproc)

      - name: Compile firmware
        run: make -j$(nproc)

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: RAX3000M-NAND-MTK-6.6-mtdrw
          path: bin/targets/mediatek/filogic/*.bin
