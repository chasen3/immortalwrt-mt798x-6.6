name: Build RAX3000M‑NAND mtd‑rw 6.6
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu‑22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@main

      - name: Install compile dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache ecj fastjar file g++ gawk gettext git libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-setuptools python3-yaml unzip wget zlib1g-dev flex bison libtool rsync

      - name: Pull mtd‑rw user‑space package
        run: git clone https://github.com/robimarko/openwrt-mtd-rw.git package/mtd-rw

      - name: Update & install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate config for CMCC‑RAX3000M NAND
        run: |
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_rax3000m=y" >> .config
          echo "CONFIG_PACKAGE_mtd-rw=y" >> .config
          make defconfig

      - name: Download source code
        run: make download -j$(nproc)

      - name: Start compile firmware
        run: make -j$(nproc)

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAX3000M‑NAND‑6.6‑mtdrw‑firmware
          path: bin/targets/mediatek/filogic/*.bin
